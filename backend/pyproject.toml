[project]
name = "satquery-backend"
version = "0.1.0"
description = "SatQuery AI backend — FastAPI service for multimodal remote sensing analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.6.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "pillow==11.0.0",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==5.0.0",
]
geo = [
    "rasterio==1.4.3",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.3.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"